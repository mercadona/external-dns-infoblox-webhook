---
# Fork-only. Builds the patched webhook and publishes it to GHCR under the Mercadona
# org, the same way mercadona/ingress-nginx does.
#
# Upstream's release.yaml is left untouched: it is driven by release-please and
# goreleaser and publishes to ghcr.io/absaoss, which is not ours to push to. It never
# fires here anyway -- it triggers on main, and our patch lives on its own branch off
# the v1.7.1 tag.
#
# NOT triggered by main: this fork's main is upstream's, unpatched. Publishing `latest`
# from it would hand out an image without the fix under a name that looks current.
#
# No QEMU. Go cross-compiles and the base image is distroless static, so each arch is
# built natively on the runner and joined into one manifest at the end.
name: Release images

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mercadona/external-dns-infoblox-webhook
  IMAGE_ARCHES: amd64 arm64

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${GITHUB_REF_NAME//\//-}-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "publishing ${{ env.IMAGE }}:${VERSION}"

      - name: Build and push one image per architecture
        run: |
          set -euo pipefail
          for arch in ${{ env.IMAGE_ARCHES }}; do
            # The version the webhook prints at startup, which is how you tell on a
            # live cluster whether the patched image is the one running.
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build \
              -ldflags "-X 'main.Version=${VERSION}' -X 'main.Gitsha=$(git rev-parse --short HEAD)'" \
              -o external-dns-infoblox-webhook ./cmd/webhook
            docker buildx build \
              --platform "linux/${arch}" \
              --tag "${{ env.IMAGE }}:${VERSION}-${arch}" \
              --push .
          done

      - name: Join the architectures into one manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ env.IMAGE }}:${VERSION}" \
            $(for arch in ${{ env.IMAGE_ARCHES }}; do \
                echo "${{ env.IMAGE }}:${VERSION}-${arch}"; \
              done)
          docker buildx imagetools inspect "${{ env.IMAGE }}:${VERSION}"
